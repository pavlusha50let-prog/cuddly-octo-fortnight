<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Самомодулирующийся FM-синтезатор</title>
  <style id="dynamic-style">
    :root {
      --hue: 210;
      --bg-color: hsl(var(--hue), 25%, 12%);
      --card-color: hsl(var(--hue), 25%, 18%);
      --accent-color: hsl(var(--hue), 85%, 60%);
      --text-color: #f0f4f8;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.4s ease;
    }
    .container {
      max-width: 820px;
      width: 100%;
      background: var(--card-color);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border: 1px solid var(--accent-color);
      transition: background-color 0.4s ease, border-color 0.4s ease;
    }
    h1 {
      margin-top: 0;
      color: var(--accent-color);
      transition: color 0.4s ease;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
      font-family: monospace;
      font-size: 1rem;
      background: rgba(0,0,0,0.25);
      padding: 1rem;
      border-radius: 8px;
    }
    canvas {
      width: 100%;
      height: 150px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      margin-bottom: 1.5rem;
      display: block;
    }
    .controls {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    button {
      background: var(--accent-color);
      color: #111;
      border: none;
      padding: 0.75rem 1.25rem;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s, background-color 0.4s ease;
    }
    button:hover {
      opacity: 0.9;
    }
    button:active {
      transform: scale(0.98);
    }
    button.secondary {
      background: transparent;
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
    }
    button.audio-btn {
      background: #10b981;
      color: #fff;
    }
    button.audio-btn.playing {
      background: #ef4444;
    }
    textarea {
      width: 100%;
      height: 220px;
      background: #0d1117;
      color: #58a6ff;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #30363d;
      box-sizing: border-box;
      resize: vertical;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🧬 Самомодулирующийся FM-синтезатор</h1>
  <p>Нажмите <strong>«Мутировать»</strong>, чтобы изменить геном: мгновенно изменятся звук, форма волны, цвет и сгенерируется новый исходный код страницы.</p>

  <div class="stats">
    <div>Поколение: <strong id="gen-display">1</strong></div>
    <div>Несущая: <strong id="carrier-display">220 Гц</strong></div>
    <div>Модулятор: <strong id="modfreq-display">55 Гц</strong></div>
    <div>Форма: <strong id="wave-display">sine</strong></div>
  </div>

  <canvas id="waveCanvas"></canvas>

  <div class="controls">
    <button id="audio-toggle" class="audio-btn" type="button">🔊 Включить звук</button>
    <button id="evolve-btn" type="button">⚡ Мутировать сейчас</button>
    <button id="run-btn" class="secondary" type="button">🚀 Открыть клон в новой вкладке</button>
    <button id="copy-btn" class="secondary" type="button">📋 Копировать HTML</button>
  </div>

  <textarea id="code-output" readonly placeholder="Здесь появится обновленный самомодулированный HTML-код..."></textarea>
</div>

<!-- Геном текущего поколения -->
<script id="genome-data">
  window.GENOME = {
    generation: 1,
    hue: 210,
    carrierFreq: 220,
    modFreq: 55,
    modDepth: 120,
    waveType: "sine"
  };
</script>

<!-- Основная логика -->
<script id="core-logic">
  (function() {
    // Текущее состояние (меняется в реальном времени)
    let state = Object.assign({}, window.GENOME);

    let audioCtx = null;
    let carrierOsc = null;
    let modOsc = null;
    let modGain = null;
    let masterGain = null;
    let isPlaying = false;

    const audioBtn = document.getElementById('audio-toggle');
    const evolveBtn = document.getElementById('evolve-btn');
    const runBtn = document.getElementById('run-btn');
    const copyBtn = document.getElementById('copy-btn');
    const codeOutput = document.getElementById('code-output');

    // --- ЗВУК ---
    function toggleAudio() {
      if (!isPlaying) {
        startAudio();
        audioBtn.textContent = '🔇 Выключить звук';
        audioBtn.classList.add('playing');
        isPlaying = true;
      } else {
        stopAudio();
        audioBtn.textContent = '🔊 Включить звук';
        audioBtn.classList.remove('playing');
        isPlaying = false;
      }
    }

    function startAudio() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      carrierOsc = audioCtx.createOscillator();
      carrierOsc.type = state.waveType;
      carrierOsc.frequency.setValueAtTime(state.carrierFreq, audioCtx.currentTime);

      modOsc = audioCtx.createOscillator();
      modOsc.type = 'sine';
      modOsc.frequency.setValueAtTime(state.modFreq, audioCtx.currentTime);

      modGain = audioCtx.createGain();
      modGain.gain.setValueAtTime(state.modDepth, audioCtx.currentTime);

      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.18, audioCtx.currentTime);

      modOsc.connect(modGain);
      modGain.connect(carrierOsc.frequency);
      carrierOsc.connect(masterGain);
      masterGain.connect(audioCtx.destination);

      carrierOsc.start();
      modOsc.start();
    }

    function stopAudio() {
      if (carrierOsc) { try { carrierOsc.stop(); } catch(e){} }
      if (modOsc) { try { modOsc.stop(); } catch(e){} }
      if (audioCtx) { try { audioCtx.close(); } catch(e){} }
    }

    // Плавное обновление звучащего синтезатора при мутации на лету
    function updateLiveAudio() {
      if (!isPlaying || !audioCtx) return;
      const now = audioCtx.currentTime;
      carrierOsc.type = state.waveType;
      carrierOsc.frequency.setTargetAtTime(state.carrierFreq, now, 0.05);
      modOsc.frequency.setTargetAtTime(state.modFreq, now, 0.05);
      modGain.gain.setTargetAtTime(state.modDepth, now, 0.05);
    }

    // --- ВИЗУАЛИЗАЦИЯ ---
    const canvas = document.getElementById('waveCanvas');
    const ctx = canvas.getContext('2d');
    let phase = 0;

    function drawWave() {
      canvas.width = canvas.offsetWidth || 700;
      canvas.height = canvas.offsetHeight || 150;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.beginPath();
      ctx.strokeStyle = `hsl(${state.hue}, 85%, 60%)`;
      ctx.lineWidth = 3;

      const ratio = state.modFreq / (state.carrierFreq || 1);
      const visualDepth = state.modDepth / 45;

      for (let x = 0; x < canvas.width; x++) {
        const t = (x / canvas.width) * Math.PI * 2;
        const modulator = Math.sin(t * ratio * 8 + phase) * visualDepth;
        let carrierVal = Math.sin(t * 6 + modulator);
        
        // Меняем форму волны на графике в зависимости от типа осциллятора
        if (state.waveType === 'sawtooth') {
          carrierVal = ((t * 6 + modulator) % Math.PI) / Math.PI * 2 - 1;
        } else if (state.waveType === 'triangle') {
          carrierVal = Math.asin(Math.sin(t * 6 + modulator)) * (2 / Math.PI);
        }

        const y = canvas.height / 2 + carrierVal * (canvas.height * 0.35);

        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      phase += isPlaying ? 0.1 : 0.03;
      requestAnimationFrame(drawWave);
    }
    drawWave();

    // --- ПРИМЕНЕНИЕ МУТАЦИИ К ТЕКУЩЕЙ СТРАНИЦЕ И СБОРКА НОВОГО КОДА ---
    function mutateAndRebuild() {
      const waveTypes = ['sine', 'triangle', 'sawtooth'];
      
      // 1. Генерируем новые параметры
      state = {
        generation: state.generation + 1,
        hue: (state.hue + Math.floor(Math.random() * 80 + 40)) % 360,
        carrierFreq: Math.round(90 + Math.random() * 450),
        modFreq: Math.round(10 + Math.random() * 250),
        modDepth: Math.round(40 + Math.random() * 350),
        waveType: waveTypes[Math.floor(Math.random() * waveTypes.length)]
      };

      // 2. Обновляем цвет текущей страницы
      document.documentElement.style.setProperty('--hue', state.hue);

      // 3. Обновляем цифры в интерфейсе текущей страницы
      document.getElementById('gen-display').textContent = state.generation;
      document.getElementById('carrier-display').textContent = state.carrierFreq + ' Гц';
      document.getElementById('modfreq-display').textContent = state.modFreq + ' Гц';
      document.getElementById('wave-display').textContent = state.waveType;

      // 4. Меняем звук прямо сейчас (если он включен)
      updateLiveAudio();

      // 5. Переписываем собственный тег <script id="genome-data"> в DOM
      const genomeTag = document.getElementById('genome-data');
      genomeTag.textContent = `\n  window.GENOME = ${JSON.stringify(state, null, 4)};\n`;

      // 6. Собираем чистый HTML-код нового поколения из обновленного DOM
      const clonedDoc = document.documentElement.cloneNode(true);
      clonedDoc.removeAttribute('style'); // убираем инлайн-стиль, т.к. запишем цвет в <style>
      
      const styleTag = clonedDoc.querySelector('#dynamic-style');
      styleTag.textContent = styleTag.textContent.replace(/--hue:\s*\d+;/, `--hue: ${state.hue};`);

      const clonedTextarea = clonedDoc.querySelector('#code-output');
      clonedTextarea.textContent = '';
      clonedTextarea.removeAttribute('value');

      const clonedBtn = clonedDoc.querySelector('#audio-toggle');
clonedBtn.textContent = '🔊 Включить звук';
clonedBtn.classList.remove('playing');
const fullHTML = '\n' + clonedDoc.outerHTML;
codeOutput.value = fullHTML;
return fullHTML;
}
// --- СОБЫТИЯ КНОПОК ---
audioBtn.addEventListener('click', toggleAudio);
evolveBtn.addEventListener('click', function() {
mutateAndRebuild();
});
runBtn.addEventListener('click', function() {
if (isPlaying) toggleAudio();
const code = codeOutput.value || mutateAndRebuild();
const blob = new Blob([code], { type: 'text/html' });
const url = URL.createObjectURL(blob);
window.open(url, '_blank');
});
copyBtn.addEventListener('click', function() {
if (!codeOutput.value) mutateAndRebuild();
codeOutput.select();
navigator.clipboard.writeText(codeOutput.value).then(() => {
const origText = copyBtn.textContent;
copyBtn.textContent = '✅ Скопировано!';
setTimeout(() => { copyBtn.textContent = origText; }, 1200);
}).catch(() => {
document.execCommand('copy');
});
});
})();																		</script>

</body>
</html>
