<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DX7 Self-Modulating FM Synthesizer + MIDI</title>
<style>
  :root {
    --bg-chassis: #2b2623;
    --bg-panel: #1f1b18;
    --accent-teal: #009c8c;
    --accent-orange: #e05a2b;
    --lcd-bg: #799c41;
    --lcd-text: #1c260d;
    --text-main: #e8e2d9;
    --text-dim: #9e9589;
    --border-color: #453d38;
  }

  * {
    box-sizing: border-box;
    user-select: none;
  }

  body {
    margin: 0;
    padding: 15px;
    background-color: #12100e;
    color: var(--text-main);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .synth-chassis {
    width: 100%;
    max-width: 1120px;
    background: var(--bg-chassis);
    border: 3px solid #14110f;
    border-radius: 10px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.1);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--accent-teal);
    padding-bottom: 12px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .brand h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--text-main);
    font-weight: 800;
  }

  .brand span {
    font-size: 11px;
    color: var(--accent-teal);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .lcd-screen {
    background: var(--lcd-bg);
    color: var(--lcd-text);
    font-family: 'Courier New', Courier, monospace;
    font-weight: bold;
    padding: 8px 14px;
    border-radius: 4px;
    border: 4px solid #111;
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.4);
    min-width: 300px;
    font-size: 13px;
    line-height: 1.4;
  }

  .global-controls {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }

  select, button {
    background: var(--bg-panel);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    padding: 7px 10px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }

  select:hover, button:hover {
    border-color: var(--accent-teal);
  }

  button.active {
    background: var(--accent-teal);
    color: #fff;
    border-color: var(--accent-teal);
  }

  button.orange {
    border-color: var(--accent-orange);
    color: #ff9a76;
  }

  button.orange:hover {
    background: var(--accent-orange);
    color: #fff;
  }

  .workspace {
    display: grid;
    grid-template-columns: 265px 1fr;
    gap: 15px;
  }

  @media (max-width: 850px) {
    .workspace {
      grid-template-columns: 1fr;
    }
  }

  .left-panel {
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .panel-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent-teal);
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 4px;
    margin: 0;
  }

  canvas#algoCanvas, canvas#scopeCanvas {
    width: 100%;
    background: #141210;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    display: block;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .control-group label {
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent-teal);
    cursor: pointer;
    margin: 0;
  }

  .operators-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  @media (max-width: 650px) {
    .operators-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  .op-card {
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .op-card.carrier {
    border-top: 3px solid var(--accent-teal);
  }

  .op-card.modulator {
    border-top: 3px solid var(--accent-orange);
  }

  .op-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
    font-size: 13px;
  }

  .op-badge {
    font-size: 9px;
    padding: 2px 5px;
    border-radius: 3px;
    text-transform: uppercase;
  }

  .carrier .op-badge {
    background: rgba(0, 156, 140, 0.2);
    color: #38e0cf;
  }

  .modulator .op-badge {
    background: rgba(224, 90, 43, 0.2);
    color: #ff9a76;
  }

  .op-slider {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .op-slider span {
    font-size: 10px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
  }

  .keyboard-container {
    background: #14110f;
    padding: 12px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    overflow-x: auto;
  }

  .keyboard {
    display: flex;
    position: relative;
    height: 115px;
    min-width: 650px;
    margin: 0 auto;
  }

  .key-white {
    flex: 1;
    background: linear-gradient(to bottom, #f4f1ea 0%, #dcd6c8 100%);
    border: 1px solid #333;
    border-radius: 0 0 4px 4px;
    cursor: pointer;
    position: relative;
    z-index: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 6px;
    color: #555;
    font-size: 10px;
    font-weight: bold;
  }

  .key-white.active {
    background: var(--accent-teal);
    color: #fff;
  }

  .key-black {
    width: 3.8%;
    height: 68px;
    background: linear-gradient(to bottom, #2b2725 0%, #110f0e 100%);
    border: 1px solid #000;
    border-radius: 0 0 3px 3px;
    position: absolute;
    z-index: 2;
    cursor: pointer;
    color: #888;
    font-size: 9px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 4px;
  }

  .key-black.active {
    background: var(--accent-orange);
    color: #fff;
  }
</style>
</head>
<body>

<div class="synth-chassis">
  <div class="header-row">
    <div class="brand">
      <h1>YAMAHA DX7-SM</h1>
      <span>6-Operator Self-Modulating FM + MIDI</span>
    </div>

    <div class="lcd-screen" id="lcd">
      INITIALIZING...
    </div>

    <div class="global-controls">
      <select id="midiSelect" aria-label="Выбор MIDI-клавиатуры" title="Выбор MIDI-клавиатуры">
        <option value="all">MIDI: Все устройства</option>
      </select>
      <select id="presetSelect" aria-label="Выбор пресета" title="Выбор пресета">
        <option value="zero">00: Zero Init</option>
        <option value="epiano">01: DX E.Piano 1</option>
        <option value="bass">02: Lately Bass</option>
        <option value="bells">03: Tubular Bells</option>
        <option value="brass">04: 80s FM Brass</option>
        <option value="chaos">05: Self-Mod Chaos</option>
      </select>
      <button id="droneBtn" title="Бесконечная генерация звука">DRONE: OFF</button>
      <button id="rndBtn" class="orange" title="Случайная самомодуляция">RANDOMIZE</button>
      <button id="resetBtn" title="Сбросить все слайдеры в ноль">RESET</button>
      <button id="saveBtn" title="Сохранить в список пресетов браузера">SAVE</button>
      <button id="delBtn" class="orange" title="Удалить выбранный сохранённый пресет">DEL</button>
      <button id="exportBtn" title="Скачать пресет как файл JSON">EXPORT</button>
      <button id="importBtn" title="Загрузить пресет из файла JSON">IMPORT</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
  </div>

  <div class="workspace">
    <div class="left-panel">
      <h3 class="panel-title">Алгоритм и обратная связь</h3>
      
      <div class="control-group">
        <label for="algoSelect"><span>Алгоритм FM</span><span id="algoVal">1</span></label>
        <select id="algoSelect" aria-label="Алгоритм FM">
          <option value="0">Algo 1: [6→5→4→3] + [2→1]</option>
          <option value="1">Algo 2: [6→5→4] + [3→2→1]</option>
          <option value="2">Algo 3: [6→5→4→3→2→1] (Цепь)</option>
          <option value="3">Algo 4: [6+5+4→3] + [2→1]</option>
          <option value="4">Algo 5: [6→5] + [4→3] + [2→1]</option>
          <option value="5">Algo 6: Все 6 операторов (Орган)</option>
        </select>
      </div>

      <canvas id="algoCanvas" width="235" height="130"></canvas>

      <div class="control-group">
        <label for="fbSlider"><span>Self-Feedback (OP6 → OP6)</span><span id="fbVal">0.00</span></label>
        <input type="range" id="fbSlider" aria-label="Self-Feedback" min="0" max="1.8" step="0.01" value="0">
      </div>

      <h3 class="panel-title">Авто-модуляция (LFO)</h3>
      <div class="control-group">
        <label for="lfoRate"><span>Скорость LFO (Гц)</span><span id="lfoRateVal">0.05</span></label>
        <input type="range" id="lfoRate" aria-label="Скорость LFO" min="0.05" max="15" step="0.05" value="0.05">
      </div>
      <div class="control-group">
        <label for="lfoDepth"><span>Глубина самомодуляции</span><span id="lfoDepthVal">0.00</span></label>
        <input type="range" id="lfoDepth" aria-label="Глубина самомодуляции" min="0" max="1" step="0.01" value="0">
      </div>

      <h3 class="panel-title">Осциллограф</h3>
      <canvas id="scopeCanvas" width="235" height="65"></canvas>
    </div>

    <div class="operators-grid" id="operatorsGrid"></div>
  </div>

  <div class="keyboard-container">
    <div class="keyboard" id="keyboard"></div>
  </div>
</div>

<script>
const PRESETS = {
  zero: {
    name: "ZERO INIT",
    algo: 0, feedback: 0, lfoRate: 0.05, lfoDepth: 0,
    ops: Array.of(
      { ratio: 0, level: 0, a: 0.005, d: 0.05, s: 0, r: 0.01 },
      { ratio: 0, level: 0, a: 0.005, d: 0.05, s: 0, r: 0.01 },
{ ratio: 0, level: 0, a: 0.005, d: 0.05, s: 0, r: 0.01 },
{ ratio: 0, level: 0, a: 0.005, d: 0.05, s: 0, r: 0.01 },
{ ratio: 0, level: 0, a: 0.005, d: 0.05, s: 0, r: 0.01 },
{ ratio: 0, level: 0, a: 0.005, d: 0.05, s: 0, r: 0.01 }
)
},
epiano: {
name: "DX E.PIANO 1",
algo: 0, feedback: 0.45, lfoRate: 1.5, lfoDepth: 0.15,
ops: Array.of(
{ ratio: 1.0, level: 0.9, a: 0.01, d: 1.5, s: 0.0, r: 0.3 },
{ ratio: 14.0, level: 0.55, a: 0.005, d: 0.14, s: 0.0, r: 0.1 },
{ ratio: 1.0, level: 0.85, a: 0.01, d: 2.2, s: 0.1, r: 0.4 },
{ ratio: 1.0, level: 0.65, a: 0.01, d: 0.9, s: 0.05, r: 0.3 },
{ ratio: 1.0, level: 0.50, a: 0.02, d: 0.6, s: 0.0, r: 0.2 },
{ ratio: 1.0, level: 0.40, a: 0.01, d: 0.4, s: 0.0, r: 0.2 }
)
},
bass: {
name: "LATELY BASS",
algo: 1, feedback: 0.85, lfoRate: 0.4, lfoDepth: 0.10,
ops: Array.of(
{ ratio: 1.0, level: 0.95, a: 0.005, d: 0.6, s: 0.3, r: 0.15 },
{ ratio: 2.0, level: 0.75, a: 0.005, d: 0.25, s: 0.1, r: 0.1 },
{ ratio: 1.0, level: 0.60, a: 0.005, d: 0.12, s: 0.0, r: 0.1 },
{ ratio: 0.5, level: 0.90, a: 0.005, d: 0.8, s: 0.4, r: 0.15 },
{ ratio: 1.0, level: 0.70, a: 0.005, d: 0.3, s: 0.15, r: 0.1 },
{ ratio: 3.0, level: 0.55, a: 0.005, d: 0.15, s: 0.0, r: 0.1 }
)
},
bells: {
name: "TUBULAR BELLS",
algo: 4, feedback: 0.30, lfoRate: 2.5, lfoDepth: 0.25,
ops: Array.of(
{ ratio: 1.0, level: 0.85, a: 0.005, d: 2.8, s: 0.0, r: 1.2 },
{ ratio: 3.5, level: 0.70, a: 0.005, d: 1.4, s: 0.0, r: 0.8 },
{ ratio: 2.0, level: 0.75, a: 0.005, d: 2.2, s: 0.0, r: 1.0 },
{ ratio: 7.0, level: 0.50, a: 0.005, d: 0.6, s: 0.0, r: 0.5 },
{ ratio: 1.0, level: 0.65, a: 0.01, d: 3.0, s: 0.0, r: 1.5 },
{ ratio: 1.41, level: 0.60, a: 0.005, d: 1.8, s: 0.0, r: 0.9 }
)
},
brass: {
name: "80S FM BRASS",
algo: 0, feedback: 0.95, lfoRate: 4.5, lfoDepth: 0.12,
ops: Array.of(
{ ratio: 1.0, level: 0.90, a: 0.08, d: 0.4, s: 0.8, r: 0.25 },
{ ratio: 1.0, level: 0.75, a: 0.10, d: 0.5, s: 0.65, r: 0.2 },
{ ratio: 1.0, level: 0.85, a: 0.06, d: 0.4, s: 0.75, r: 0.25 },
{ ratio: 2.0, level: 0.65, a: 0.12, d: 0.6, s: 0.5, r: 0.2 },
{ ratio: 1.0, level: 0.70, a: 0.09, d: 0.5, s: 0.6, r: 0.2 },
{ ratio: 1.0, level: 0.80, a: 0.07, d: 0.4, s: 0.7, r: 0.2 }
)
},
chaos: {
name: "SELF-MOD CHAOS",
algo: 2, feedback: 1.55, lfoRate: 0.35, lfoDepth: 0.85,
ops: Array.of(
{ ratio: 1.0, level: 0.95, a: 0.5, d: 2.0, s: 0.8, r: 1.5 },
{ ratio: 1.5, level: 0.80, a: 0.8, d: 2.5, s: 0.7, r: 1.5 },
{ ratio: 2.75, level: 0.75, a: 0.3, d: 1.8, s: 0.6, r: 1.5 },
{ ratio: 0.5, level: 0.85, a: 1.2, d: 3.0, s: 0.8, r: 1.5 },
{ ratio: 5.25, level: 0.65, a: 0.4, d: 1.5, s: 0.5, r: 1.5 },
{ ratio: 3.14, level: 0.90, a: 0.2, d: 2.0, s: 0.9, r: 1.5 }
)
}
};
const ALGO_CARRIERS = Array.of(
Array.of(1, 3),
Array.of(1, 4),
Array.of(1),
Array.of(1, 3),
Array.of(1, 3, 5),
Array.of(1, 2, 3, 4, 5, 6)
);
let audioCtx = null;
let scriptNode = null;
let analyser = null;
let currentState = JSON.parse(JSON.stringify(PRESETS.zero));
let isDrone = false;
let midiStatusText = 'WAIT';
let selectedMidiInputId = 'all';
let voices = new Array();
let lfoPhase = 0;
let pitchBend = 1.0;
function engineNoteOn(note, freq, vel) {
voices = voices.filter(v => v.note !== note);
if (voices.length >= 10) voices.shift();
voices.push({
note: note,
freq: freq,
vel: vel,
p0: 0, p1: 0, p2: 0, p3: 0, p4: 0, p5: 0,
e0: 0, e1: 0, e2: 0, e3: 0, e4: 0, e5: 0,
s0: 'attack', s1: 'attack', s2: 'attack', s3: 'attack', s4: 'attack', s5: 'attack',
fbPrev1: 0,
fbPrev2: 0
});
}
function engineNoteOff(note) {
for (let v of voices) {
if (v.note === note) {
v.s0 = 'release'; v.s1 = 'release'; v.s2 = 'release';
v.s3 = 'release'; v.s4 = 'release'; v.s5 = 'release';
}
}
}
function stepEnv(env, state, op, dt) {
if (state === 'attack') {
const rate = Math.max(0.002, op.a);
env += dt / rate;
if (env >= 1.0) { env = 1.0; state = 'decay'; }
} else if (state === 'decay') {
const rate = Math.max(0.005, op.d);
env -= (1.0 - op.s) * (dt / rate);
if (env <= op.s) { env = op.s; state = 'sustain'; }
} else if (state === 'sustain') {
env = op.s;
} else if (state === 'release') {
const rate = Math.max(0.01, op.r);
env -= dt / rate;
if (env <= 0) { env = 0; state = 'off'; }
}
return { env: env, state: state };
}
function initAudio() {
if (audioCtx) {
if (audioCtx.state === 'suspended') audioCtx.resume();
return;
}
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
audioCtx = new AudioContextClass();
const bufferSize = 1024;
scriptNode = audioCtx.createScriptProcessor(bufferSize, 0, 1);
analyser = audioCtx.createAnalyser();
analyser.fftSize = 512;
const sampleRate = audioCtx.sampleRate;
const dt = 1.0 / sampleRate;
const TWO_PI = Math.PI * 2;
scriptNode.onaudioprocess = function(e) {
const outBuf = e.outputBuffer.getChannelData(0);
const len = outBuf.length;
const op0 = currentState.ops.at(0);
const op1 = currentState.ops.at(1);
const op2 = currentState.ops.at(2);
const op3 = currentState.ops.at(3);
const op4 = currentState.ops.at(4);
const op5 = currentState.ops.at(5);
const algo = currentState.algo;
const baseFb = currentState.feedback;
const lfoRate = currentState.lfoRate;
const lfoDepth = currentState.lfoDepth;
for (let i = 0; i < len; i++) {
lfoPhase = (lfoPhase + lfoRate * dt) % 1.0;
const lfoVal = Math.sin(lfoPhase * TWO_PI) * lfoDepth;
let sampleSum = 0;
for (let vIdx = voices.length - 1; vIdx >= 0; vIdx--) {
const v = voices.at(vIdx);
const r0 = stepEnv(v.e0, v.s0, op0, dt); v.e0 = r0.env; v.s0 = r0.state;
const r1 = stepEnv(v.e1, v.s1, op1, dt); v.e1 = r1.env; v.s1 = r1.state;
const r2 = stepEnv(v.e2, v.s2, op2, dt); v.e2 = r2.env; v.s2 = r2.state;
const r3 = stepEnv(v.e3, v.s3, op3, dt); v.e3 = r3.env; v.s3 = r3.state;
const r4 = stepEnv(v.e4, v.s4, op4, dt); v.e4 = r4.env; v.s4 = r4.state;
const r5 = stepEnv(v.e5, v.s5, op5, dt); v.e5 = r5.env; v.s5 = r5.state;
if (v.s0 === 'off' && v.s1 === 'off' && v.s2 === 'off' && v.s3 === 'off' && v.s4 === 'off' && v.s5 === 'off') {
voices.splice(vIdx, 1);
continue;
}
const modScale = Math.max(0, 1.0 + lfoVal * 1.5);
const effFeedback = Math.max(0, baseFb + lfoVal * 0.6);
const fbSignal = (v.fbPrev1 + v.fbPrev2) * 0.5 * effFeedback * 3.0;
const o5 = Math.sin(v.p5 + fbSignal) * op5.level * v.e5;
v.fbPrev2 = v.fbPrev1;
v.fbPrev1 = o5;
const m = (val) => val * 4.5 * modScale;
let o0 = 0, o1 = 0, o2 = 0, o3 = 0, o4 = 0;
let voiceOut = 0;
if (algo === 0) {
o4 = Math.sin(v.p4 + m(o5)) * op4.level * v.e4;
o3 = Math.sin(v.p3 + m(o4)) * op3.level * v.e3;
o2 = Math.sin(v.p2 + m(o3)) * op2.level * v.e2;
o1 = Math.sin(v.p1) * op1.level * v.e1;
o0 = Math.sin(v.p0 + m(o1)) * op0.level * v.e0;
voiceOut = (o0 + o2) * 0.5;
} else if (algo === 1) {
o4 = Math.sin(v.p4 + m(o5)) * op4.level * v.e4;
o3 = Math.sin(v.p3 + m(o4)) * op3.level * v.e3;
o2 = Math.sin(v.p2) * op2.level * v.e2;
o1 = Math.sin(v.p1 + m(o2)) * op1.level * v.e1;
o0 = Math.sin(v.p0 + m(o1)) * op0.level * v.e0;
voiceOut = (o0 + o3) * 0.5;
} else if (algo === 2) {
o4 = Math.sin(v.p4 + m(o5)) * op4.level * v.e4;
o3 = Math.sin(v.p3 + m(o4)) * op3.level * v.e3;
o2 = Math.sin(v.p2 + m(o3)) * op2.level * v.e2;
o1 = Math.sin(v.p1 + m(o2)) * op1.level * v.e1;
o0 = Math.sin(v.p0 + m(o1)) * op0.level * v.e0;
voiceOut = o0 * 0.85;
} else if (algo === 3) {
o4 = Math.sin(v.p4) * op4.level * v.e4;
o3 = Math.sin(v.p3) * op3.level * v.e3;
o2 = Math.sin(v.p2 + m(o3 + o4 + o5)) * op2.level * v.e2;
o1 = Math.sin(v.p1) * op1.level * v.e1;
o0 = Math.sin(v.p0 + m(o1)) * op0.level * v.e0;
voiceOut = (o0 + o2) * 0.5;
} else if (algo === 4) {
o4 = Math.sin(v.p4 + m(o5)) * op4.level * v.e4;
o3 = Math.sin(v.p3) * op3.level * v.e3;
o2 = Math.sin(v.p2 + m(o3)) * op2.level * v.e2;
o1 = Math.sin(v.p1) * op1.level * v.e1;
o0 = Math.sin(v.p0 + m(o1)) * op0.level * v.e0;
voiceOut = (o0 + o2 + o4) * 0.35;
} else {
o0 = Math.sin(v.p0) * op0.level * v.e0;
o1 = Math.sin(v.p1) * op1.level * v.e1;
o2 = Math.sin(v.p2) * op2.level * v.e2;
o3 = Math.sin(v.p3) * op3.level * v.e3;
o4 = Math.sin(v.p4) * op4.level * v.e4;
voiceOut = (o0 + o1 + o2 + o3 + o4 + o5) * 0.2;
}
sampleSum += voiceOut * v.vel;
const baseStep = TWO_PI * (v.freq * pitchBend) * dt;
v.p0 = (v.p0 + baseStep * op0.ratio) % TWO_PI;
v.p1 = (v.p1 + baseStep * op1.ratio) % TWO_PI;
v.p2 = (v.p2 + baseStep * op2.ratio) % TWO_PI;
v.p3 = (v.p3 + baseStep * op3.ratio) % TWO_PI;
v.p4 = (v.p4 + baseStep * op4.ratio) % TWO_PI;
v.p5 = (v.p5 + baseStep * op5.ratio) % TWO_PI;
}
outBuf.set(Array.of(Math.tanh(sampleSum * 0.75)), i);
}
};
scriptNode.connect(analyser);
analyser.connect(audioCtx.destination);
}
function updateParam(key, val, opIdx) {
if (opIdx !== undefined) {
const targetOp = currentState.ops.at(opIdx);
Reflect.set(targetOp, key, val);
} else {
Reflect.set(currentState, key, val);
}
updateLCD();
}
async function initMIDI() {
if (!navigator.requestMIDIAccess) {
midiStatusText = 'NO API';
updateLCD();
return;
}
try {
const midiAccess = await navigator.requestMIDIAccess({ sysex: false });
updateMIDIDevices(midiAccess);
midiAccess.onstatechange = () => updateMIDIDevices(midiAccess);
} catch (err) {
midiStatusText = 'DENIED';
updateLCD();
}
}
function updateMIDIDevices(midiAccess) {
const select = document.getElementById('midiSelect');
const prevVal = select.value;
select.innerHTML = '';
const defaultOpt = document.createElement('option');
defaultOpt.value = 'all';
defaultOpt.textContent = 'MIDI: Все устройства';
select.appendChild(defaultOpt);
let count = 0;
for (let input of midiAccess.inputs.values()) {
count++;
const opt = document.createElement('option');
opt.value = input.id;
opt.textContent = 'MIDI: ' + (input.name || 'Keyboard ' + count);
select.appendChild(opt);
input.onmidimessage = handleMIDIMessage;
}
for (let opt of select.options) {
if (opt.value === prevVal) {
select.value = prevVal;
break;
}
}
midiStatusText = count > 0 ? 'ON (' + count + ')' : 'NONE';
updateLCD();
}
function handleMIDIMessage(event) {
if (selectedMidiInputId !== 'all' && event.target.id !== selectedMidiInputId) return;
const status = event.data.at(0);
const data1 = event.data.at(1);
const data2 = event.data.at(2);
const command = status & 0xf0;
if (command === 0x90 && data2 > 0) {
const velocity = 0.3 + (data2 / 127) * 0.7;
playNote(data1, velocity);
} else if (command === 0x80 || (command === 0x90 && data2 === 0)) {
stopNote(data1);
} else if (command === 0xb0 && data1 === 1) {
const depth = +(data2 / 127).toFixed(2);
document.getElementById('lfoDepth').value = depth;
document.getElementById('lfoDepthVal').textContent = depth.toFixed(2);
updateParam('lfoDepth', depth);
} else if (command === 0xe0) {
const bendVal = ((data2 << 7) | data1) - 8192;
const semitones = (bendVal / 8192) * 2;
pitchBend = Math.pow(2, semitones / 12);
}
}
function createSliderRow(labelText, valueText, idStr, minVal, maxVal, stepVal, curVal, opIdx, keyName) {

wrap.appendChild(topLine);
wrap.appendChild(inp);
return wrap;

else label.textContent = val.toFixed(2);

});
});
}
function drawAlgorithm() {
const canvas = document.getElementById('algoCanvas');
const ctx = canvas.getContext('2d');
ctx.clearRect(0, 0, canvas.width, canvas.height);
const algo = currentState.algo;
const carriers = ALGO_CARRIERS.at(algo);
const layouts = Array.of(
{
nodes: Array.of(null, {x:165,y:108}, {x:165,y:65}, {x:70,y:108}, {x:70,y:76}, {x:70,y:48}, {x:70,y:20}),
links: Array.of({from:6,to:5}, {from:5,to:4}, {from:4,to:3}, {from:2,to:1})
},
{
nodes: Array.of(null, {x:165,y:108}, {x:165,y:65}, {x:165,y:25}, {x:70,y:108}, {x:70,y:65}, {x:70,y:25}),
links: Array.of({from:6,to:5}, {from:5,to:4}, {from:3,to:2}, {from:2,to:1})
},
{
nodes: Array.of(null, {x:35,y:98}, {x:115,y:98}, {x:195,y:98}, {x:195,y:30}, {x:115,y:30}, {x:35,y:30}),
links: Array.of({from:6,to:5}, {from:5,to:4}, {from:4,to:3}, {from:3,to:2}, {from:2,to:1})
},
{
nodes: Array.of(null, {x:185,y:105}, {x:185,y:45}, {x:75,y:105}, {x:115,y:35}, {x:75,y:35}, {x:35,y:35}),
links: Array.of({from:6,to:3}, {from:5,to:3}, {from:4,to:3}, {from:2,to:1})
},
{
nodes: Array.of(null, {x:190,y:100}, {x:190,y:35}, {x:117,y:100}, {x:117,y:35}, {x:45,y:100}, {x:45,y:35}),
links: Array.of({from:6,to:5}, {from:4,to:3}, {from:2,to:1})
},
{
nodes: Array.of(null, {x:25,y:68}, {x:62,y:68}, {x:99,y:68}, {x:136,y:68}, {x:173,y:68}, {x:210,y:68}),
links: new Array()
}
);
const layout = layouts.at(algo);
ctx.strokeStyle = '#888';
ctx.lineWidth = 1.5;
layout.links.forEach(link => {
const p1 = layout.nodes.at(link.from);
const p2 = layout.nodes.at(link.to);
ctx.beginPath();
ctx.moveTo(p1.x, p1.y);
ctx.lineTo(p2.x, p2.y);
ctx.stroke();
});
const p6 = layout.nodes.at(6);
ctx.strokeStyle = '#ff9a76';
ctx.beginPath();
ctx.arc(p6.x + 11, p6.y - 8, 8, 0, Math.PI * 2);
ctx.stroke();
for (let i = 1; i <= 6; i++) {
const pt = layout.nodes.at(i);
const isCarrier = carriers.includes(i);
ctx.fillStyle = isCarrier ? '#009c8c' : '#e05a2b';
ctx.fillRect(pt.x - 11, pt.y - 11, 22, 22);
ctx.strokeStyle = '#fff';
ctx.lineWidth = 1;
ctx.strokeRect(pt.x - 11, pt.y - 11, 22, 22);
ctx.fillStyle = '#fff';
ctx.font = 'bold 11px monospace';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText(String(i), pt.x, pt.y);
}
}
function drawScope() {
const canvas = document.getElementById('scopeCanvas');
const ctx = canvas.getContext('2d');
const w = canvas.width;
const h = canvas.height;
ctx.fillStyle = '#141210';
ctx.fillRect(0, 0, w, h);
ctx.strokeStyle = '#009c8c';
ctx.lineWidth = 1.5;
ctx.beginPath();
if (analyser) {
const bufferLength = analyser.frequencyBinCount;
const dataArray = new Uint8Array(bufferLength);
analyser.getByteTimeDomainData(dataArray);
const sliceWidth = w / bufferLength;
let x = 0;
for (let i = 0; i < bufferLength; i++) {
const v = dataArray.at(i) / 128.0;
const y = (v * h) / 2;
if (i === 0) ctx.moveTo(x, y);
else ctx.lineTo(x, y);
x += sliceWidth;
}
} else {
ctx.moveTo(0, h / 2);
ctx.lineTo(w, h / 2);
}
ctx.stroke();
requestAnimationFrame(drawScope);
}

{ note: 71, black: false, key: 'u' },
{ note: 72, black: false, key: 'i' }
);
const activeNotes = new Set();
function playNote(note, vel = 1.0) {
initAudio();
if (activeNotes.has(note)) return;
activeNotes.add(note);
const freq = 440 * Math.pow(2, (note - 69) / 12);
engineNoteOn(note, freq, vel);
const el = document.querySelector('[data-note="' + note + '"]');
if (el) el.classList.add('active');
}
function stopNote(note) {
if (isDrone) return;
activeNotes.delete(note);
engineNoteOff(note);
const el = document.querySelector('[data-note="' + note + '"]');
if (el) el.classList.remove('active');
}
function buildKeyboard() {
const kb = document.getElementById('keyboard');
const whiteNotes = NOTES.filter(n => !n.black);
const whiteWidthPercent = 100 / whiteNotes.length;
let whiteIdx = 0;
NOTES.forEach(n => {
const keyEl = document.createElement('div');
keyEl.dataset.note = n.note;
keyEl.textContent = n.key.toUpperCase();
if (!n.black) {
keyEl.className = 'key-white';
kb.appendChild(keyEl);
whiteIdx++;
} else {
keyEl.className = 'key-black';
keyEl.style.left = 'calc(' + (whiteIdx * whiteWidthPercent) + '% - 1.9%)';
kb.appendChild(keyEl);
}
keyEl.addEventListener('mousedown', () => playNote(n.note));
keyEl.addEventListener('mouseup', () => stopNote(n.note));
keyEl.addEventListener('mouseleave', () => stopNote(n.note));
});
}

const STORAGE_KEY = 'dx7_custom_presets_v1';
function loadUserPresets() {
const select = document.getElementById('presetSelect');
select.querySelectorAll('option[data-custom="true"]').forEach(opt => opt.remove());
const raw = localStorage.getItem(STORAGE_KEY);
if (!raw) return;
try {
const savedList = JSON.parse(raw);
savedList.forEach((preset, idx) => {
const opt = document.createElement('option');
opt.value = 'custom_' + idx;
opt.dataset.custom = 'true';
opt.textContent = '★ ' + preset.name;
select.appendChild(opt);
});
} catch (e) {
console.error('Ошибка чтения сохраненных пресетов:', e);
}
}
document.getElementById('presetSelect').addEventListener('change', (e) => {
const key = e.target.value;
if (key.startsWith('custom_')) {
const idx = parseInt(key.replace('custom_', ''), 10);
const raw = localStorage.getItem(STORAGE_KEY);
const savedList = raw ? JSON.parse(raw) : new Array();
const found = savedList.at(idx);
if (found) {
currentState = JSON.parse(JSON.stringify(found));
applyStateToUI();
}
} else {
currentState = JSON.parse(JSON.stringify(Reflect.get(PRESETS, key)));
applyStateToUI();
}
});
document.getElementById('saveBtn').addEventListener('click', () => {
const defaultName = currentState.name === 'ZERO INIT' ? 'MY PATCH' : currentState.name;
const userName = prompt('Введите название для вашего пресета:', defaultName);
if (!userName || !userName.trim()) return;
const cleanName = userName.trim().toUpperCase().slice(0, 16);
currentState.name = cleanName;
const raw = localStorage.getItem(STORAGE_KEY);
const savedList = raw ? JSON.parse(raw) : new Array();
savedList.push(JSON.parse(JSON.stringify(currentState)));
localStorage.setItem(STORAGE_KEY, JSON.stringify(savedList));

select.value = 'custom_' + (savedList.length - 1);

});
document.getElementById('delBtn').addEventListener('click', () => {
const select = document.getElementById('presetSelect');
const key = select.value;
if (!key.startsWith('custom_')) {
alert('Заводские пресеты (00–05) удалить нельзя. Выберите ваш сохранённый пресет со звёздочкой ★.');
return;
}
const presetLabel = select.options.item(select.selectedIndex).textContent;
if (!confirm('Удалить пресет "' + presetLabel + '"?')) return;
const idx = parseInt(key.replace('custom_', ''), 10);
const raw = localStorage.getItem(STORAGE_KEY);

savedList.splice(idx, 1);
localStorage.setItem(STORAGE_KEY, JSON.stringify(savedList));
loadUserPresets();
select.value = 'zero';
currentState = JSON.parse(JSON.stringify(PRESETS.zero));
applyStateToUI();
});
