<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DX7 Self-Modulating FM Synthesizer + MIDI</title>
<style>
  :root {
    --bg-chassis: #2b2623;
    --bg-panel: #1f1b18;
    --accent-teal: #009c8c;
    --accent-orange: #e05a2b;
    --lcd-bg: #799c41;
    --lcd-text: #1c260d;
    --text-main: #e8e2d9;
    --text-dim: #9e9589;
    --border-color: #453d38;
  }

  * {
    box-sizing: border-box;
    user-select: none;
  }

  body {
    margin: 0;
    padding: 15px;
    background-color: #12100e;
    color: var(--text-main);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .synth-chassis {
    width: 100%;
    max-width: 1120px;
    background: var(--bg-chassis);
    border: 3px solid #14110f;
    border-radius: 10px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.1);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--accent-teal);
    padding-bottom: 12px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .brand h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--text-main);
    font-weight: 800;
  }

  .brand span {
    font-size: 11px;
    color: var(--accent-teal);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .lcd-screen {
    background: var(--lcd-bg);
    color: var(--lcd-text);
    font-family: 'Courier New', Courier, monospace;
    font-weight: bold;
    padding: 8px 14px;
    border-radius: 4px;
    border: 4px solid #111;
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.4);
    min-width: 300px;
    font-size: 13px;
    line-height: 1.4;
  }

  .global-controls {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }

  select, button {
    background: var(--bg-panel);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    padding: 7px 10px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }

  select:hover, button:hover {
    border-color: var(--accent-teal);
  }

  button.active {
    background: var(--accent-teal);
    color: #fff;
    border-color: var(--accent-teal);
  }

  button.orange {
    border-color: var(--accent-orange);
    color: #ff9a76;
  }

  button.orange:hover {
    background: var(--accent-orange);
    color: #fff;
  }

  .workspace {
    display: grid;
    grid-template-columns: 265px 1fr;
    gap: 15px;
  }

  @media (max-width: 850px) {
    .workspace {
      grid-template-columns: 1fr;
    }
  }

  .left-panel {
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .panel-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent-teal);
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 4px;
    margin: 0;
  }

  canvas#algoCanvas, canvas#scopeCanvas {
    width: 100%;
    background: #141210;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    display: block;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .control-group label {
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent-teal);
    cursor: pointer;
    margin: 0;
  }

  .operators-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  @media (max-width: 650px) {
    .operators-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  .op-card {
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .op-card.carrier {
    border-top: 3px solid var(--accent-teal);
  }

  .op-card.modulator {
    border-top: 3px solid var(--accent-orange);
  }

  .op-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
    font-size: 13px;
  }

  .op-badge {
    font-size: 9px;
    padding: 2px 5px;
    border-radius: 3px;
    text-transform: uppercase;
  }

  .carrier .op-badge {
    background: rgba(0, 156, 140, 0.2);
    color: #38e0cf;
  }

  .modulator .op-badge {
    background: rgba(224, 90, 43, 0.2);
    color: #ff9a76;
  }

  .op-slider {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .op-slider span {
    font-size: 10px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
  }

  .keyboard-container {
    background: #14110f;
    padding: 12px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    overflow-x: auto;
  }

  .keyboard {
    display: flex;
    position: relative;
    height: 115px;
    min-width: 650px;
    margin: 0 auto;
  }

  .key-white {
    flex: 1;
    background: linear-gradient(to bottom, #f4f1ea 0%, #dcd6c8 100%);
    border: 1px solid #333;
    border-radius: 0 0 4px 4px;
    cursor: pointer;
    position: relative;
    z-index: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 6px;
    color: #555;
    font-size: 10px;
    font-weight: bold;
  }

  .key-white.active {
    background: var(--accent-teal);
    color: #fff;
  }

  .key-black {
    width: 3.8%;
    height: 68px;
    background: linear-gradient(to bottom, #2b2725 0%, #110f0e 100%);
    border: 1px solid #000;
    border-radius: 0 0 3px 3px;
    position: absolute;
    z-index: 2;
    cursor: pointer;
    color: #888;
    font-size: 9px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 4px;
  }

  .key-black.active {
    background: var(--accent-orange);
    color: #fff;
  }
</style>
</head>
<body>

<div class="synth-chassis">
  <div class="header-row">
    <div class="brand">
      <h1>YAMAHA DX7-SM</h1>
      <span>6-Operator Self-Modulating FM + MIDI (AudioWorklet)</span>
    </div>

    <div class="lcd-screen" id="lcd">
      INITIALIZING...
    </div>

    <div class="global-controls">
      <select id="midiSelect" aria-label="Выбор MIDI-клавиатуры" title="Выбор MIDI-клавиатуры">
        <option value="all">MIDI: Все устройства</option>
      </select>
      <select id="presetSelect" aria-label="Выбор пресета" title="Выбор пресета">
        <option value="zero">00: Zero Init</option>
        <option value="epiano">01: DX E.Piano 1</option>
        <option value="bass">02: Lately Bass</option>
        <option value="bells">03: Tubular Bells</option>
        <option value="brass">04: 80s FM Brass</option>
        <option value="chaos">05: Self-Mod Chaos</option>
      </select>
      <button id="droneBtn" title="Бесконечная генерация звука">DRONE: OFF</button>
      <button id="rndBtn" class="orange" title="Случайная самомодуляция">RANDOMIZE</button>
      <button id="resetBtn" title="Сбросить все слайдеры в ноль">RESET</button>
      <button id="saveBtn" title="Сохранить в список пресетов браузера">SAVE</button>
      <button id="delBtn" class="orange" title="Удалить выбранный сохранённый пресет">DEL</button>
      <button id="exportBtn" title="Скачать пресет как файл JSON">EXPORT</button>
      <button id="importBtn" title="Загрузить пресет из файла JSON">IMPORT</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
  </div>

  <div class="workspace">
    <div class="left-panel">
      <h3 class="panel-title">Алгоритм и обратная связь</h3>
      
      <div class="control-group">
        <label for="algoSelect"><span>Алгоритм FM</span><span id="algoVal">1</span></label>
        <select id="algoSelect" aria-label="Алгоритм FM">
          <option value="0">Algo 1: [6→5→4→3] + [2→1]</option>
          <option value="1">Algo 2: [6→5→4] + [3→2→1]</option>
          <option value="2">Algo 3: [6→5→4→3→2→1] (Цепь)</option>
          <option value="3">Algo 4: [6+5+4→3] + [2→1]</option>
          <option value="4">Algo 5: [6→5] + [4→3] + [2→1]</option>
          <option value="5">Algo 6: Все 6 операторов (Орган)</option>
        </select>
      </div>

      <canvas id="algoCanvas" width="235" height="130"></canvas>

      <div class="control-group">
        <label for="fbSlider"><span>Self-Feedback (OP6 → OP6)</span><span id="fbVal">0.00</span></label>
        <input type="range" id="fbSlider" aria-label="Self-Feedback" min="0" max="1.6" step="0.01" value="0">
      </div>

      <h3 class="panel-title">Авто-модуляция (LFO)</h3>
      <div class="control-group">
        <label for="lfoRate"><span>Скорость LFO (Гц)</span><span id="lfoRateVal">0.05</span></label>
        <input type="range" id="lfoRate" aria-label="Скорость LFO" min="0.05" max="15" step="0.05" value="0.05">
      </div>
      <div class="control-group">
        <label for="lfoDepth"><span>Глубина самомодуляции</span><span id="lfoDepthVal">0.00</span></label>
        <input type="range" id="lfoDepth" aria-label="Глубина самомодуляции" min="0" max="1" step="0.01" value="0">
      </div>

      <h3 class="panel-title">Осциллограф</h3>
      <canvas id="scopeCanvas" width="235" height="65"></canvas>
    </div>

    <div class="operators-grid" id="operatorsGrid"></div>
  </div>

  <div class="keyboard-container">
    <div class="keyboard" id="keyboard"></div>
  </div>
</div>

<script>
const PRESETS = {
  zero: {
    name: "ZERO INIT",
    algo: 0, feedback: 0, lfoRate: 0.05, lfoDepth: 0,
    ops: Array.of(
      { ratio: 0, level: 0, a: 0.005, d: 0.05, s: 0, r: 0.01 },
      { ratio: 0, level: 0, a: 0.005, d: 0.05, s: 0, r: 0.01 },
      { ratio: 0, level: 0, a: 0.005, d: 0.05, s: 0, r: 0.01 },
      { ratio: 0, level: 0, a: 0.005, d: 0.05, s: 0, r: 0.01 },
      { ratio: 0, level: 0, a: 0.005, d: 0.05, s: 0, r: 0.01 },
      { ratio: 0, level: 0, a: 0.005, d: 0.05, s: 0, r: 0.01 }
    )
  },
  epiano: {
    name: "DX E.PIANO 1",
    algo: 0, feedback: 0.45, lfoRate: 1.5, lfoDepth: 0.15,
    ops: Array.of(
      { ratio: 1.0, level: 0.9, a: 0.01, d: 1.5, s: 0.0, r: 0.3 },
      { ratio: 14.0, level: 0.55, a: 0.005, d: 0.14, s: 0.0, r: 0.1 },
      { ratio: 1.0, level: 0.85, a: 0.01, d: 2.2, s: 0.1, r: 0.4 },
      { ratio: 1.0, level: 0.65, a: 0.01, d: 0.9, s: 0.05, r: 0.3 },
      { ratio: 1.0, level: 0.50, a: 0.02, d: 0.6, s: 0.0, r: 0.2 },
      { ratio: 1.0, level: 0.40, a: 0.01, d: 0.4, s: 0.0, r: 0.2 }
    )
  },
  bass: {
    name: "LATELY BASS",
    algo: 1, feedback: 0.85, lfoRate: 0.4, lfoDepth: 0.10,
    ops: Array.of(
      { ratio: 1.0, level: 0.95, a: 0.005, d: 0.6, s: 0.3, r: 0.15 },
      { ratio: 2.0, level: 0.75, a: 0.005, d: 0.25, s: 0.1, r: 0.1 },
      { ratio: 1.0, level: 0.60, a: 0.005, d: 0.12, s: 0.0, r: 0.1 },
      { ratio: 0.5, level: 0.90, a: 0.005, d: 0.8, s: 0.4, r: 0.15 },
      { ratio: 1.0, level: 0.70, a: 0.005, d: 0.3, s: 0.15, r: 0.1 },
      { ratio: 3.0, level: 0.55, a: 0.005, d: 0.15, s: 0.0, r: 0.1 }
    )
  },
  bells: {
    name: "TUBULAR BELLS",
    algo: 4, feedback: 0.30, lfoRate: 2.5, lfoDepth: 0.25,
    ops: Array.of(
      { ratio: 1.0, level: 0.85, a: 0.005, d: 2.8, s: 0.0, r: 1.2 },
      { ratio: 3.5, level: 0.70, a: 0.005, d: 1.4, s: 0.0, r: 0.8 },
      { ratio: 2.0, level: 0.75, a: 0.005, d: 2.2, s: 0.0, r: 1.0 },
      { ratio: 7.0, level: 0.50, a: 0.005, d: 0.6, s: 0.0, r: 0.5 },
      { ratio: 1.0, level: 0.65, a: 0.01, d: 3.0, s: 0.0, r: 1.5 },
      { ratio: 1.41, level: 0.60, a: 0.005, d: 1.8, s: 0.0, r: 0.9 }
    )
  },
  brass: {
    name: "80S FM BRASS",
    algo: 0, feedback: 0.95, lfoRate: 4.5, lfoDepth: 0.12,
    ops: Array.of(
      { ratio: 1.0, level: 0.90, a: 0.08, d: 0.4, s: 0.8, r: 0.25 },
      { ratio: 1.0, level: 0.75, a: 0.10, d: 0.5, s: 0.65, r: 0.2 },
      { ratio: 1.0, level: 0.85, a: 0.06, d: 0.4, s: 0.75, r: 0.25 },
      { ratio: 2.0, level: 0.65, a: 0.12, d: 0.6, s: 0.5, r: 0.2 },
      { ratio: 1.0, level: 0.70, a: 0.09, d: 0.5, s: 0.6, r: 0.2 },
      { ratio: 1.0, level: 0.80, a: 0.07, d: 0.4, s: 0.7, r: 0.2 }
    )
  },
  chaos: {
    name: "SELF-MOD CHAOS",
    algo: 2, feedback: 1.25, lfoRate: 0.35, lfoDepth: 0.75,
    ops: Array.of(
      { ratio: 1.0, level: 0.95, a: 0.5, d: 2.0, s: 0.8, r: 1.5 },
      { ratio: 1.5, level: 0.80, a: 0.8, d: 2.5, s: 0.7, r: 1.5 },
      { ratio: 2.75, level: 0.75, a: 0.3, d: 1.8, s: 0.6, r: 1.5 },
      { ratio: 0.5, level: 0.85, a: 1.2, d: 3.0, s: 0.8, r: 1.5 },
      { ratio: 5.25, level: 0.65, a: 0.4, d: 1.5, s: 0.5, r: 1.5 },
      { ratio: 3.14, level: 0.90, a: 0.2, d: 2.0, s: 0.9, r: 1.5 }
    )
  }
};

const ALGO_CARRIERS = Array.of(
  Array.of(1, 3),
  Array.of(1, 4),
  Array.of(1),
  Array.of(1, 3),
  Array.of(1, 3, 5),
  Array.of(1, 2, 3, 4, 5, 6)
);

const WORKLET_CODE = `
const ENV_OFF = 0, ENV_ATK = 1, ENV_DEC = 2, ENV_SUS = 3, ENV_REL = 4, ENV_STEAL = 5;
const TWO_PI = Math.PI * 2;

class DX7WorkletProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.voices = new Array();
    this.lfoPhase = 0;
    this.pitchBend = 1.0;
    this.state = {
      algo: 0, feedback: 0, lfoRate: 0.05, lfoDepth: 0,
      ops: Array.of(
        { ratio: 0, level: 0, a: 0.005, d: 0.05, s: 0, r: 0.01 },
        { ratio: 0, level: 0, a: 0.005, d: 0.05, s: 0, r: 0.01 },
        { ratio: 0, level: 0, a: 0.005, d: 0.05, s: 0, r: 0.01 },
        { ratio: 0, level: 0, a: 0.005, d: 0.05, s: 0, r: 0.01 },
        { ratio: 0, level: 0, a: 0.005, d: 0.05, s: 0, r: 0.01 },
        { ratio: 0, level: 0, a: 0.005, d: 0.05, s: 0, r: 0.01 }
      )
    };
    this.smoothFb = 0;
    this.smoothLfoDepth = 0;
    this.sl0 = 0; this.sl1 = 0; this.sl2 = 0;
    this.sl3 = 0; this.sl4 = 0; this.sl5 = 0;
    this.dcPrevIn = 0;
    this.dcPrevOut = 0;

    this.port.onmessage = (e) => {
      const msg = e.data;
      if (msg.type === 'state') {
        this.state = msg.state;
      } else if (msg.type === 'param') {
        if (msg.opIdx !== undefined) Reflect.set(this.state.ops.at(msg.opIdx), msg.key, msg.val);
        else Reflect.set(this.state, msg.key, msg.val);
      } else if (msg.type === 'pitchBend') {
        this.pitchBend = msg.val;
      } else if (msg.type === 'noteOn') {
        this.noteOn(msg.note, msg.freq, msg.vel);
      } else if (msg.type === 'noteOff') {
        this.noteOff(msg.note);
      }
    };
  }

  noteOn(note, freq, vel) {
    for (let i = 0; i < this.voices.length; i++) {
      const v = this.voices.at(i);
      if (v.note === note) {
        v.s0 = v.s1 = v.s2 = v.s3 = v.s4 = v.s5 = ENV_STEAL;
      }
    }
    let activeCount = 0;
    for (let i = 0; i < this.voices.length; i++) {
      if (this.voices.at(i).s0 !== ENV_STEAL) activeCount++;
    }
    if (activeCount >= 10) {
      for (let i = 0; i < this.voices.length; i++) {
        const v = this.voices.at(i);
        if (v.s0 !== ENV_STEAL) {
          v.s0 = v.s1 = v.s2 = v.s3 = v.s4 = v.s5 = ENV_STEAL;
          break;
        }
      }
    }
    this.voices.push({
      note: note, freq: freq, vel: vel,
      p0: 0, p1: 0, p2: 0, p3: 0, p4: 0, p5: 0,
      e0: 0, e1: 0, e2: 0, e3: 0, e4: 0, e5: 0,
      s0: ENV_ATK, s1: ENV_ATK, s2: ENV_ATK, s3: ENV_ATK, s4: ENV_ATK, s5: ENV_ATK,
      fbPrev1: 0, fbPrev2: 0
    });
  }

  noteOff(note) {
    for (let i = 0; i < this.voices.length; i++) {
      const v = this.voices.at(i);
      if (v.note === note && v.s0 !== ENV_STEAL) {
        if (v.s0 !== ENV_OFF) v.s0 = ENV_REL;
        if (v.s1 !== ENV_OFF) v.s1 = ENV_REL;
        if (v.s2 !== ENV_OFF) v.s2 = ENV_REL;
        if (v.s3 !== ENV_OFF) v.s3 = ENV_REL;
        if (v.s4 !== ENV_OFF) v.s4 = ENV_REL;
        if (v.s5 !== ENV_OFF) v.s5 = ENV_REL;
      }
    }
  }

  process(inputs, outputs) {
    const firstOut = outputs.at(0);
    if (!firstOut) return true;
    const outBuf = firstOut.at(0);
    if (!outBuf) return true;
    const len = outBuf.length;

    const dt = 0.5 / sampleRate;
    const STEAL_STEP = dt / 0.005;

    const ops = this.state.ops;
    const op0 = ops.at(0), op1 = ops.at(1), op2 = ops.at(2);
    const op3 = ops.at(3), op4 = ops.at(4), op5 = ops.at(5);

    const r0 = op0.ratio, r1 = op1.ratio, r2 = op2.ratio;
    const r3 = op3.ratio, r4 = op4.ratio, r5 = op5.ratio;

    const atk0 = dt / Math.max(0.003, op0.a), dec0 = (1.0 - op0.s) * (dt / Math.max(0.005, op0.d)), sus0 = op0.s, rel0 = dt / Math.max(0.01, op0.r);
    const atk1 = dt / Math.max(0.003, op1.a), dec1 = (1.0 - op1.s) * (dt / Math.max(0.005, op1.d)), sus1 = op1.s, rel1 = dt / Math.max(0.01, op1.r);
    const atk2 = dt / Math.max(0.003, op2.a), dec2 = (1.0 - op2.s) * (dt / Math.max(0.005, op2.d)), sus2 = op2.s, rel2 = dt / Math.max(0.01, op2.r);
    const atk3 = dt / Math.max(0.003, op3.a), dec3 = (1.0 - op3.s) * (dt / Math.max(0.005, op3.d)), sus3 = op3.s, rel3 = dt / Math.max(0.01, op3.r);
    const atk4 = dt / Math.max(0.003, op4.a), dec4 = (1.0 - op4.s) * (dt / Math.max(0.005, op4.d)), sus4 = op4.s, rel4 = dt / Math.max(0.01, op4.r);
    const atk5 = dt / Math.max(0.003, op5.a), dec5 = (1.0 - op5.s) * (dt / Math.max(0.005, op5.d)), sus5 = op5.s, rel5 = dt / Math.max(0.01, op5.r);

    const algo = this.state.algo;
    const targetFb = this.state.feedback;

{ note: 55, black: false, key: 'b' },
{ note: 56, black: true,  key: 'h' },
{ note: 57, black: false, key: 'n' },
{ note: 58, black: true,  key: 'j' },
{ note: 59, black: false, key: 'm' },
{ note: 60, black: false, key: 'q' },
{ note: 61, black: true,  key: '2' },
{ note: 62, black: false, key: 'w' },
{ note: 63, black: true,  key: '3' },
{ note: 64, black: false, key: 'e' },
{ note: 65, black: false, key: 'r' },
{ note: 66, black: true,  key: '5' },
{ note: 67, black: false, key: 't' },
{ note: 68, black: true,  key: '6' },
{ note: 69, black: false, key: 'y' },
{ note: 70, black: true,  key: '7' },
{ note: 71, black: false, key: 'u' },
{ note: 72, black: false, key: 'i' }
);
const activeNotes = new Set();
async function playNote(note, vel = 1.0) {
await initAudio();
if (activeNotes.has(note)) return;
activeNotes.add(note);
const freq = 440 * Math.pow(2, (note - 69) / 12);
engineNoteOn(note, freq, vel);
const el = document.querySelector('[data-note="' + note + '"]');
if (el) el.classList.add('active');
}
function stopNote(note) {
if (isDrone) return;
activeNotes.delete(note);
engineNoteOff(note);
const el = document.querySelector('[data-note="' + note + '"]');
if (el) el.classList.remove('active');
}
function buildKeyboard() {
const kb = document.getElementById('keyboard');
const whiteNotes = NOTES.filter(n => !n.black);
const whiteWidthPercent = 100 / whiteNotes.length;
let whiteIdx = 0;
NOTES.forEach(n => {
const keyEl = document.createElement('div');
keyEl.dataset.note = n.note;
keyEl.textContent = n.key.toUpperCase();
if (!n.black) {
keyEl.className = 'key-white';
kb.appendChild(keyEl);
whiteIdx++;
} else {
keyEl.className = 'key-black';
keyEl.style.left = 'calc(' + (whiteIdx * whiteWidthPercent) + '% - 1.9%)';
kb.appendChild(keyEl);
}
keyEl.addEventListener('mousedown', () => playNote(n.note));
keyEl.addEventListener('mouseup', () => stopNote(n.note));
keyEl.addEventListener('mouseleave', () => stopNote(n.note));
});
}
window.addEventListener('keydown', (e) => {
if (e.repeat) return;
const found = NOTES.find(n => n.key === e.key.toLowerCase());
if (found) playNote(found.note);
});
window.addEventListener('keyup', (e) => {
const found = NOTES.find(n => n.key === e.key.toLowerCase());
if (found) stopNote(found.note);
});
document.getElementById('midiSelect').addEventListener('change', (e) => {
selectedMidiInputId = e.target.value;
});
document.getElementById('algoSelect').addEventListener('change', (e) => {
currentState.algo = parseInt(e.target.value);
document.getElementById('algoVal').textContent = currentState.algo + 1;
renderOperators();
drawAlgorithm();
updateParam('algo', currentState.algo);
});
document.getElementById('fbSlider').addEventListener('input', (e) => {
const val = parseFloat(e.target.value);
document.getElementById('fbVal').textContent = val.toFixed(2);
updateParam('feedback', val);
});
document.getElementById('lfoRate').addEventListener('input', (e) => {
const val = parseFloat(e.target.value);
document.getElementById('lfoRateVal').textContent = val.toFixed(2);
updateParam('lfoRate', val);
});
document.getElementById('lfoDepth').addEventListener('input', (e) => {
const val = parseFloat(e.target.value);
document.getElementById('lfoDepthVal').textContent = val.toFixed(2);
updateParam('lfoDepth', val);
});
document.getElementById('droneBtn').addEventListener('click', async (e) => {
await initAudio();
isDrone = !isDrone;
e.target.textContent = 'DRONE: ' + (isDrone ? 'ON' : 'OFF');
e.target.classList.toggle('active', isDrone);
if (isDrone) {
playNote(48);
playNote(55);
} else {
Array.from(activeNotes).forEach(n => stopNote(n));
}
});
document.getElementById('rndBtn').addEventListener('click', () => {
const ratios = Array.of(0.5, 1.0, 1.5, 2.0, 3.0, 4.0, 5.0, 7.0, 1.41, 2.75);
currentState.name = "RND SELF-MOD";
currentState.algo = Math.floor(Math.random() * 6);
currentState.feedback = +(Math.random() * 1.5).toFixed(2);
currentState.lfoRate = +(0.1 + Math.random() * 6).toFixed(2);
currentState.lfoDepth = +(0.15 + Math.random() * 0.75).toFixed(2);
for (let i = 0; i < 6; i++) {
const op = currentState.ops.at(i);
op.ratio = ratios.at(Math.floor(Math.random() * ratios.length));
op.level = +(0.3 + Math.random() * 0.7).toFixed(2);
op.a = +(0.01 + Math.random() * 0.4).toFixed(2);
op.d = +(0.2 + Math.random() * 2.5).toFixed(2);
op.s = +(Math.random() * 0.8).toFixed(2);
op.r = +(0.1 + Math.random() * 1.5).toFixed(2);
}
applyStateToUI();
});
document.getElementById('resetBtn').addEventListener('click', () => {
currentState = JSON.parse(JSON.stringify(PRESETS.zero));
document.getElementById('presetSelect').value = 'zero';
applyStateToUI();
});
// ================= SAVE / LOAD / DEL / EXPORT / IMPORT =================
const STORAGE_KEY = 'dx7_custom_presets_v1';
function loadUserPresets() {
const select = document.getElementById('presetSelect');
select.querySelectorAll('option[data-custom="true"]').forEach(opt => opt.remove());
const raw = localStorage.getItem(STORAGE_KEY);
if (!raw) return;
try {
const savedList = JSON.parse(raw);
savedList.forEach((preset, idx) => {
const opt = document.createElement('option');
opt.value = 'custom_' + idx;
opt.dataset.custom = 'true';
opt.textContent = '★ ' + preset.name;
select.appendChild(opt);
});
} catch (e) {
console.error('Ошибка чтения сохраненных пресетов:', e);
}
}
document.getElementById('presetSelect').addEventListener('change', (e) => {
const key = e.target.value;
if (key.startsWith('custom_')) {
const idx = parseInt(key.replace('custom_', ''), 10);
const raw = localStorage.getItem(STORAGE_KEY);
const savedList = raw ? JSON.parse(raw) : new Array();
const found = savedList.at(idx);
if (found) {
currentState = JSON.parse(JSON.stringify(found));
applyStateToUI();
}
} else {
currentState = JSON.parse(JSON.stringify(Reflect.get(PRESETS, key)));
applyStateToUI();
}
});
document.getElementById('saveBtn').addEventListener('click', () => {
const defaultName = currentState.name === 'ZERO INIT' ? 'MY PATCH' : currentState.name;
const userName = prompt('Введите название для вашего пресета:', defaultName);
if (!userName || !userName.trim()) return;
const cleanName = userName.trim().toUpperCase().slice(0, 16);
currentState.name = cleanName;
const raw = localStorage.getItem(STORAGE_KEY);
const savedList = raw ? JSON.parse(raw) : new Array();
savedList.push(JSON.parse(JSON.stringify(currentState)));
localStorage.setItem(STORAGE_KEY, JSON.stringify(savedList));
loadUserPresets();
const select = document.getElementById('presetSelect');
select.value = 'custom_' + (savedList.length - 1);
updateLCD();
});
document.getElementById('delBtn').addEventListener('click', () => {
const select = document.getElementById('presetSelect');
const key = select.value;
if (!key.startsWith('custom_')) {
alert('Заводские пресеты (00–05) удалить нельзя. Выберите ваш сохранённый пресет со звёздочкой ★.');
return;
}
const presetLabel = select.options.item(select.selectedIndex).textContent;
if (!confirm('Удалить пресет "' + presetLabel + '"?')) return;
const idx = parseInt(key.replace('custom_', ''), 10);
const raw = localStorage.getItem(STORAGE_KEY);
const savedList = raw ? JSON.parse(raw) : new Array();
savedList.splice(idx, 1);
localStorage.setItem(STORAGE_KEY, JSON.stringify(savedList));
loadUserPresets();
select.value = 'zero';
currentState = JSON.parse(JSON.stringify(PRESETS.zero));
applyStateToUI();
});
document.getElementById('exportBtn').addEventListener('click', () => {
const dataStr = JSON.stringify(currentState, null, 2);
const blob = new Blob(Array.of(dataStr), { type: 'application/json' });
const url = URL.createObjectURL(blob);
const link = document.createElement('a');
const safeFileName = (currentState.name || 'dx7_patch').replace(/[^a-zA-Z0-9_-]/g, '_');
link.href = url;
link.download = safeFileName + '.json';
link.click();
URL.revokeObjectURL(url);
});
document.getElementById('importBtn').addEventListener('click', () => {
document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (e) => {
const file = e.target.files.item(0);
if (!file) return;
const reader = new FileReader();
reader.onload = (ev) => {
try {
const parsed = JSON.parse(ev.target.result);
if (parsed && Array.isArray(parsed.ops) && parsed.ops.length === 6) {
currentState = parsed;
applyStateToUI();
} else {
alert('Неверный формат файла пресета DX7.');
}
} catch (err) {
alert('Ошибка чтения JSON-файла.');
}
e.target.value = '';
};
reader.readAsText(file);
});
buildKeyboard();
loadUserPresets();
applyStateToUI();
initMIDI();
drawScope();</script>
